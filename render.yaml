services:
  - type: web
    name: chemtech-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn chatbot:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ADMIN_EMAIL
        value: sawaiz9898@gmail.com
      - key: DATABASE_URL
        sync: false   # Set this manually in Render dashboard to your Neon connection string
